# Validates the manifest, the marketplace file and the hooks module, then runs
# the tests against the engine, on every push and pull request.
name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.322
      - name: Validate
        run: claude plugin validate .
      - name: Test
        run: claude plugin test .
